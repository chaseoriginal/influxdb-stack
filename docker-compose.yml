version: "3.8"

# influxdb-stack
#
# InfluxDB 2.7 single-container deployment for Home Assistant metrics.
# Runs as a plain (non-swarm) docker-compose on ore-dock-102-1 (10.77.102.100).
#
# All secrets come from .env (gitignored). See .env.example for the contract.
#
# Deploy:  cd /opt/influxdb-stack && docker compose up -d
# Restart: cd /opt/influxdb-stack && docker compose restart
# Logs:    cd /opt/influxdb-stack && docker compose logs -f
# UI:      http://10.77.102.100:8086  (admin / see INFLUXDB_ADMIN_PASSWORD in .env)

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    hostname: influxdb
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?admin password required}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-echoinggreen}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-homeassistant}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-30d}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:?admin token required}
      - INFLUXDB_HTTP_BIND_ADDRESS=:8086
    network_mode: host
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

volumes:
  influxdb_data:
  influxdb_config:
